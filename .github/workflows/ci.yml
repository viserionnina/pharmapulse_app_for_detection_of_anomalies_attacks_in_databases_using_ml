name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev gcc pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: |
          python3 -c "import flask; import flask_login; import flask_wtf; import MySQLdb; print('Flask imports OK')"
          python3 -c "import sklearn; import pandas; import numpy; import matplotlib; print('ML imports OK')"
          python3 -c "from ml.if_features import SQL_KEYWORDS, keyword_features; print('ML features OK')"
          python3 -c "from ml.detector import detect; print('Detector import OK')"
