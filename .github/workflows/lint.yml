name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: |
          flake8 app.py ml/detector.py ml/if_features.py \
            --max-line-length=120 \
            --ignore=E302,E303,E501,W503,E741,F401,W291,W293,E265,E266,E201,E202,W605,E402,E305,E128,E231,E261,E262,E241 \
            --count
